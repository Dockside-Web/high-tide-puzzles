<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Anchor chain on the diagonal: two flat links joined by an edge-on link.
       Links are two-tone (dark edge, brass core) so they read on light and dark backgrounds. -->
  <g transform="translate(32 32) rotate(-45)">
    <!-- Flat links -->
    <g fill="none">
      <rect x="-31" y="-10" width="27" height="20" rx="10" stroke="#1c2433" stroke-width="8"/>
      <rect x="-31" y="-10" width="27" height="20" rx="10" stroke="#e3a43f" stroke-width="4"/>
      <rect x="4" y="-10" width="27" height="20" rx="10" stroke="#1c2433" stroke-width="8"/>
      <rect x="4" y="-10" width="27" height="20" rx="10" stroke="#e3a43f" stroke-width="4"/>
    </g>

    <!-- Edge-on link threaded through both -->
    <rect x="-16" y="-4.5" width="32" height="9" rx="4.5" fill="#f4d394" stroke="#1c2433" stroke-width="3"/>

    <!-- Highlights -->
    <g stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.6" stroke-linecap="round">
      <path d="M-24 -10H-12"/>
      <path d="M11 -10H23"/>
      <path d="M-9 -1.5H9"/>
    </g>
  </g>
</svg>
