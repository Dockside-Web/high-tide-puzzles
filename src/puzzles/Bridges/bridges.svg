<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- A small Bridges board: four numbered islands joined by bridges.
       Bridges are two-tone (dark edge, light core) so they read on light and dark backgrounds. -->
  <g stroke-linecap="round">
    <path d="M25 10H39M25 18H39M14 25V39M46 25V39M54 25V39M25 50H39" stroke="#1c2433" stroke-width="7.5"/>
    <path d="M25 10H39M25 18H39M14 25V39M46 25V39M54 25V39M25 50H39" stroke="#8fd0e8" stroke-width="3.6"/>
  </g>

  <!-- Islands -->
  <g fill="#ffffff" stroke="#1c2433" stroke-width="3.5">
    <circle cx="14" cy="14" r="11"/>
    <circle cx="50" cy="14" r="11"/>
    <circle cx="14" cy="50" r="11"/>
    <circle cx="50" cy="50" r="11"/>
  </g>

  <!-- Island numbers: 3, 4, 2, 3 (the bridges touching each one) -->
  <g fill="none" stroke="#1c2433" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path transform="translate(14 14) scale(1.15)" d="M-3 -4.5H2.5L-0.6 -0.8C3.6 -1 3.8 4.8 -0.3 4.6C-1.9 4.5 -2.8 3.9 -3.2 3.2"/>
    <path transform="translate(50 14) scale(1.15)" d="M1.6 4.6V-4.6L-3.4 1.8H3.6"/>
    <path transform="translate(14 50) scale(1.15)" d="M-3 -2.3C-3 -5.6 3 -5.6 3 -2.2C3 0.2 -3 2 -3 4.6H3.2"/>
    <path transform="translate(50 50) scale(1.15)" d="M-3 -4.5H2.5L-0.6 -0.8C3.6 -1 3.8 4.8 -0.3 4.6C-1.9 4.5 -2.8 3.9 -3.2 3.2"/>
  </g>
</svg>
