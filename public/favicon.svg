<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Rope looped around the ring -->
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#1c2433" stroke-width="5.5"/>
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#e0b067" stroke-width="3"/>
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#a8742f" stroke-width="3" stroke-dasharray="1.6 2.4"/>

  <!-- Life ring: white band with coral sections on the diagonals -->
  <circle cx="32" cy="32" r="16.5" fill="none" stroke="#ffffff" stroke-width="11.5"/>
  <circle cx="32" cy="32" r="16.5" fill="none" stroke="#f07056" stroke-width="11.5"
          stroke-dasharray="12.96 12.96" transform="rotate(22.5 32 32)"/>

  <!-- Highlights on the coral -->
  <g stroke="#ffffff" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round">
    <path d="M21.3 19.3L24 23.4"/>
    <path d="M44.7 21.3L40.6 24"/>
  </g>

  <!-- Ring outlines -->
  <circle cx="32" cy="32" r="22.25" fill="none" stroke="#1c2433" stroke-width="3"/>
  <circle cx="32" cy="32" r="10.75" fill="none" stroke="#1c2433" stroke-width="3"/>

  <!-- Clips holding the rope -->
  <g fill="#3d5a8c" stroke="#1c2433" stroke-width="1.5">
    <rect x="-3.5" y="-4.5" width="7" height="9" rx="1.5" transform="translate(50.5 50.5) rotate(-45)"/>
    <rect x="-3.5" y="-4.5" width="7" height="9" rx="1.5" transform="translate(13.5 50.5) rotate(45)"/>
    <rect x="-3.5" y="-4.5" width="7" height="9" rx="1.5" transform="translate(13.5 13.5) rotate(-45)"/>
    <rect x="-3.5" y="-4.5" width="7" height="9" rx="1.5" transform="translate(50.5 13.5) rotate(45)"/>
  </g>
</svg>
