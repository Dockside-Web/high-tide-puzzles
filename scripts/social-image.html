<!doctype html>
<!--
  The link-preview image (public/og-main.png, 1200x630) shown when the site is shared.
  To remake it after changing this file, from the project folder:
    "/c/Program Files/Google/Chrome/Application/chrome.exe" --headless --disable-gpu --hide-scrollbars \
      --window-size=1200,630 --virtual-time-budget=5000 \
      --screenshot="$(cygpath -m "$PWD")/public/og-main.png" "file:///$(cygpath -m "$PWD")/scripts/social-image.html"
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500&family=Fredoka:wght@600;700&display=block"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #faf7f0;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 36px;
        font-family: Inter, sans-serif;
        color: #102a43;
      }
      /* Same as the site's stacked logo (src/components/common/Logo.astro) */
      .logo {
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: Fredoka, sans-serif;
        font-size: 92px;
        font-weight: 700;
        text-transform: uppercase;
        color: #13294b;
        line-height: 1;
      }
      .logo-line {
        display: flex;
        align-items: center;
        gap: 0.12em;
        letter-spacing: 0.03em;
      }
      .logo-sub {
        margin-top: 0.1em;
        padding-left: 0.42em;
        font-size: 0.55em;
        font-weight: 600;
        letter-spacing: 0.42em;
      }
      .logo img {
        width: 1.85em;
        height: 1.85em;
      }
      .tagline {
        margin: 0;
        font-size: 38px;
        font-weight: 500;
        color: #54687a;
      }
      .icons {
        display: flex;
        gap: 36px;
      }
      .icons img {
        width: 84px;
        height: 84px;
      }
    </style>
  </head>
  <body>
    <div class="logo">
      <div class="logo-line">
        <span>High</span>
        <img src="../src/puzzles/Buoy/buoy.svg" alt="" />
        <span>Tide</span>
      </div>
      <span class="logo-sub">Puzzles</span>
    </div>
    <p class="tagline">A fresh wave of puzzles every day.</p>
    <div class="icons">
      <img src="../src/puzzles/SeaGlass/sea-glass.svg" alt="" />
      <img src="../src/puzzles/AnchorChain/anchor-chain.svg" alt="" />
      <img src="../src/puzzles/Bridges/bridges.svg" alt="" />
    </div>
  </body>
</html>
